<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iceberg — nothing here</title>
<style>
  :root { --void:#04070c; --ice:#7fe3ff; --frost:#e9f3ff; --muted:#8ea9c4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--void); color:var(--frost);
         font-family:"IBM Plex Sans",system-ui,sans-serif; }
  a { color:var(--ice); text-decoration:none; border:1px solid rgba(127,227,255,.35);
      padding:.6rem 1.1rem; border-radius:2px; display:inline-block; margin:0 .3rem; }
  a:hover { background:rgba(127,227,255,.1); }
  body { display: grid; place-items: center; min-height: 100dvh; text-align: center; padding: 2rem; }
  h1 { font-size: clamp(2.5rem, 12vw, 6rem); font-stretch: 125%; color: var(--ice); }
  p { color: var(--muted); max-width: 40ch; }
</style>
</head>
<body class="grain">
  <div>
    <h1>404</h1>
    <p>No floe at this address. Your machines are where you left them.</p>
    <p class="row" style="justify-content:center;margin-top:1.5rem">
      <a class="btn btn--cold" href="./">Home</a>
      <a class="btn" href="machine.html">Open the machine</a>
    </p>
  </div>
</body>
</html>
